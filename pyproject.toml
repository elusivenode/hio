[project]
name = "hio"
version = "0.1.0"
description = "HIO: Home Investment Office, an independent investment research system (S1a: synthetic-fixture foundation)"
readme = "README.md"
requires-python = "==3.13.*"
license = { text = "All rights reserved" }
dependencies = [
    "duckdb>=1.1",      # local, rebuildable catalogue index (architecture §2, HIO-ADR-0009)
    "pyyaml>=6.0",      # factor specs and registers are YAML (factor-specification standard)
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.120",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hio"]

[tool.uv]
required-version = ">=0.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
xfail_strict = true

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "tests", "tools"]
# Python only: Markdown records (handoffs, decisions, history) are never reformatted (OD-0020 item 5).
include = ["*.py", "*.pyi"]
# Migration evidence cited by MIGRATION-MAP.md: kept byte-identical, not reformatted (OD-0020 item 5).
extend-exclude = ["tools/verify_migration.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "DTZ", "ARG"]
ignore = ["RUF001", "RUF002", "RUF003"]   # the documents use typographic characters (−, ≤, …) on purpose

[tool.ruff.lint.per-file-ignores]
# A pytest fixture shared from another test module is imported by name and used as a parameter.
"tests/test_s1b1_shared_receipt.py" = ["F811"]
