# HIO experiment register. Schema: templates/experiment.yaml.
# Rules: pre-register before results; never delete failed or abandoned
# entries; keep the variant count honest (docs/harness/operating-model.md §4).
- id: E-0001
  hypothesis: H-0005
  status: complete
  pre_registration:
    committed_revision: "self: the commit that adds this entry, before any Treasury data was downloaded (OD-0157)"
    sample:
      start: "the first date with both 7y and 10y present; expected 1990-01-02 [EXT, unverified]. A later start is stated in the results, never silently taken"
      end: "the last date with both 7y and 10y present, on or before the download date T"
      frequency: "consecutive published dates with both tenors"
      knowledge_mode: "latest; every value reconstructed(T); no as_known_by_market claim"
      cutoff_rule: "one one-off download at T, at most 40 requests; a later re-download is a new variant"
    data_handling:
      missing_tenor: "a date without 7y or 10y is not an observation: the period spans it, and it is counted. Longer than 5 calendar days is flagged; longer than a coupon period refuses that period, and the series is split and reported"
      missing_knot: "the return stands; that period is counted as uncovered by the sensitivity"
      duplicate_identical: "one row kept; counted"
      duplicate_conflicting: "stop: no output until the owner has seen the count"
      unparseable_or_out_of_range: "stop if any value is non-numeric other than blank or N/A, or outside -5% to 25%"
      large_moves: "periods with a 10y move above 50 bp are counted and kept, never removed"
    test: >-
      Build R_t by spec 0.1.3, with the decomposition and d_t. Report everything for the full sample, for dates up to and
      after 2021-12-06 (Treasury's par-curve method change [EXT, to be checked at T]) and for the crossing period alone, which
      stays in the primary sample. A movement there isn't attributed to the method change without evidence.
    metrics: [periods, excluded_counts_by_reason, gap_counts, residual_max_abs, residual_breaches, d_abs_p50, d_abs_p99, d_abs_max, d_annualised_compounded, coverage, zero_curve_failures, rebuild_byte_identity]
    bars:
      implementation:
        B1: "RA-INV-013, CMT-INV-1 to 6 and ZC-INV-1 to 3 pass on the code that runs"
        B2: "real data: no CMT-INV-5 breach, residual below 1 bp when |dy| < 25 bp"
        B3: "real data: ZC-INV-1 holds, and no D_n <= 0, on every covered date"
        B4: "two runs from the retained bytes are byte-identical"
        B5: "every parsed row is accounted for: included plus excluded by reason equals parsed; retained bytes match their manifest"
      approximation:
        B6: "|d_t| at most 1 bp in at least 99% of covered periods"
        B7: "max |d_t| at most 5 bp"
        B8: "|compounded annualised difference| at most 10 bp a year, in the full sample and in each of the two sub-samples"
      coverage:
        B9: "the sensitivity covers at least 95% of periods"
    costs: "n/a (gross, frictionless, explanatory); a stated limitation"
    decision_rule: >-
      All bars pass: "construction diagnostics completed; UNREFERENCED", never "factor validated". B1 to B5 failing rejects
      the implementation until corrected, as a recorded variant. B6 to B8 failing rejects the approximation's adequacy for
      this purpose. B9 failing leaves B6 to B8 inconclusive. A negative return, or a large drawdown, supports or rejects
      nothing. Bars aren't changed after results exist; any change is a variant, stated with its reason.
    not_tested: "traded-return agreement, costs, historical availability, diversification, and the alternative interpolation the spec lists as a sensitivity"
  variants:
    - id: V1
      change: "post-hoc, after B6 and B7 failed: spec 0.2.0 values on the zero curve, with flat yield as the comparison. Interpolation sensitivity: a monotone cubic par grid through the same knots against the linear one. Same retained bytes, same dates"
      reason: "OD-0163. It doesn't reverse E-0001's verdict, and it is still UNREFERENCED, with no promotion"
      revision: 7399b55
      result: "docs/evidence/e0001/variant-1.md: cubic against linear inside all three numbers; zero against flat as in E-0001"
      decision_rule: "descriptive. The monotone-cubic difference is read against B6 to B8's own numbers (1 bp on 99% of periods, 5 bp at worst, 10 bp a year). Within them says interpolation isn't decisive here, and nothing about market accuracy. Declared before any variant result"
  inputs: {releases: ["rel-05e05e482265376e8e33c19fcb868a2be69e782eb037a4b1fed196666a904376"], specs: ["rates.us.cmt_10y.total_return@0.1.3"]}
  runs: ["49e1b4d, docs/evidence/e0001/result-1.md"]
  results: {estimates: "values held locally; quotation_in_documents is unknown", uncertainty: "not estimated", diagnostics: "B1 to B5, B8, B9 pass; B6 and B7 fail"}
  negative_findings: "the flat-yield approximation failed B6 and B7"
  outcome: not_supported
  follow_up: "owner decision on the valuation basis; any change is a new variant, and no bar moves"
  reviewed_by: null
- id: E-0002
  hypothesis: H-0006
  status: running
  pre_registration:
    committed_revision: "self: the commit that adds this entry, before any EODHD data was retrieved (OD-0162, OD-0163)"
    sample:
      start: "the first date common to all three sleeves; about 2007 [EXT, unverified], stated in the results"
      end: "the last common date on or before retrieval T"
      frequency: "daily wealth; monthly primary statistics, weekly as sensitivity"
      knowledge_mode: "latest; every value reconstructed(T); no as_known_by_market claim"
      cutoff_rule: "the snapshot named in the run"
    qualification:
      Q1_identity: "each of SPY, IEF, BIL: rows present; no duplicate, unordered or non-positive close; no gap over 7 calendar days; quote currency USD"
      Q2_actions: "every distribution has unadjustedValue and USD currency; every split parses; actions off an observed day are moved to the next observed day and counted"
      Q3_internal: "constructed total return within 1 bp of the adjusted-close return in at least 99% of periods. An INTERNAL consistency check only, between two EODHD fields"
      Q4_snapshots: "raw closes and distributions unchanged between snapshots, or each change counted"
      Q5_reference: "reported where issuer records are read: distributions matched, missing or differing, as counts. Unread means not independently checked, and is said so"
      gate: "Q1 to Q3 must pass for all three sleeves before the comparison runs"
    test: >-
      Allocations, weights fixed: 100% equity; 60% equity with 40% BIL; 60% equity with 40% IEF. Market-price total return under RA 3.1
      and 5, reinvest_ex_close, gross of withholding. Rebalanced at the last common date of each month, fractional holdings, no costs.
      Reported for the full window, before and from 2020-01-01, and 2008, Q1 2020 and 2022 as separate windows with wealth restarted;
      no period is spliced out. Primary comparison: 60/40 BIL against 60/40 IEF. Paired joint block bootstrap of monthly returns,
      10,000 replications, seed 20260002, blocks of 12 months, with 6 and 24 as sensitivity; 2.5th to 97.5th percentile.
    metrics: [compounded_wealth, annualised_return, annualised_volatility, max_drawdown, recovery_date, longest_underwater_days, underwater_fraction, covariance, correlation]
    costs: "fund fees embedded in market prices; no trading costs and no tax: stated limitations"
    decision_rule: >-
      Descriptive. Intervals spanning zero mean the evidence doesn't distinguish the two 60/40 allocations on that metric. It supports no
      recommendation, forecast or statement about the future. IEF is a vehicle and validates no synthetic factor. Any change after
      results exist is a variant, stated with its reason.
    not_tested: "AUD translation, costs, tax, other funds, tail dependence, predictive use"
  variants:
    - {id: V1, change: "qualification corrected to its pre-registered meaning: quote currency checked, every period in Q3's denominator; run on snapshot s2", reason: "REVIEW-2026-11-04-t0022-1 F-1, F-2; allocations, windows and bootstrap unchanged", revision: 185c33a}
    - {id: V3, change: "correction: a named window's monthly volatility and dependence now count its last complete month, which V0 and V1 left out; the from-2020 window starts at 2019-12-31 in both reports. Weekly figures still leave out a final week. A last month counts only if the data reaches the window's stated end (F-VERIFY-2026-11-04-e0002-v3-1); the reconciliation fails on an availability mismatch and marks a check not made as null (-2)", reason: "found comparing the USD and AUD reports at the owner's question; earlier monthly volatility for before_2020, 2008, q1_2020 and 2022 must not be relied on", revision: "the commit adding this entry"}
    - {id: V2, change: "AUD variant: the three allocations, unhedged under RA 4.1, monthly only, on H.10 AUD/USD noon New York rates; a rate up to 5 days old is used and counted, older stops; compounded asset, currency and cross contributions; the same windows, seed and blocks. EODHD's AUD/USD compared with H.10: passes if within 1% on at least 95% of common dates, and can flag but not validate. Declared before any AUD result", reason: "OD-0167", revision: "the commit adding tools/e0002_aud.py"}
  inputs: {releases: [], specs: ["equity.us.spy.market_total_return@0.1.0", "rates.us.ief.market_total_return@0.1.0", "cash.us.bil.market_total_return@0.1.0"]}
  runs: ["14e8e1a, snapshot s1", "185c33a, snapshot s2, docs/evidence/e0002/assessment-1.md", "475173b, snapshot s2 and V2"]
  results: {estimates: "values held locally for the owner; agent use and quotation are denied", uncertainty: "paired block bootstrap, held locally", diagnostics: "Q1 to Q3 pass for all sleeves; Q4 no changes over minutes only; Q5 BGBL only, one unresolved difference; SPY, IEF and BIL within 0.10 points a year of issuer fact sheets on 17 of 17 checks, 2016 onward only"}
  negative_findings: "F-1: BGBL 2026-07-01 distribution record differs from the issuer's"
  outcome: null
  follow_up: "a second snapshot, and independent checks of the sleeves"
  reviewed_by: null
- id: E-0003
  hypothesis: H-0007
  status: complete
  pre_registration:
    committed_revision: "self: the commit that adds this entry, before retained RBA data was read for it (OD-0170)"
    sample:
      start: "the first month end on or after the first Cash Rate TRI level, expected 2011-01-31; the same for all three allocations"
      end: "the last complete month end in E-0002's snapshot s2; expected 2026-10-30"
      frequency: monthly
      knowledge_mode: "latest; reconstructed(T); no as_known_by_market claim"
      cutoff_rule: "the newest retained F1 receipt, and snapshot s2"
    cash_accrual: "the RBA Cash Rate TRI (FIRMMCTRI), level to level at the latest level within 5 days on or before each month end. HIO accrues nothing itself. TRI labels are publication dates, so a month's boundary can differ by a day: a limitation"
    fx_translation: "RA 4.1, s = q(t-1)/q(t) - 1 for H.10 USD per AUD, noon New York, the latest rate within 5 days; equity, bills and Treasuries unhedged; AUD cash not translated"
    return_conventions: "market-price total return under RA 3.1 and 5 from E-0002 snapshot s2; simple returns compounded; no trading costs or tax"
    rebalance: "to target at every month end; fractional holdings"
    allocations: "60% SPY in every case, with 40% in AUD cash, USD bills (BIL) or US Treasuries (IEF)"
    primary_comparisons:
      cash_rate_and_currency: "USD bills minus AUD cash: the combined effect of the rate gap and the currency. The compounded split into rate gap, currency and cross is labelled descriptive"
      treasury_duration: "US Treasuries minus USD bills, both unhedged: the incremental duration effect, with vehicle basis included"
      total: "US Treasuries minus AUD cash"
    windows: "full; before and from 2019-12-31; Q1 2020; 2022. No period is spliced out"
    test: "paired joint block bootstrap of aligned monthly constituent returns, rebuilding each path with monthly rebalancing: 10,000 replications, seed 20260002, blocks 12, 6 and 24 months; 2.5th to 97.5th percentile"
    metrics: [compounded_wealth, annualised_return, annualised_volatility, max_drawdown, recovery_date, longest_underwater_days, correlations]
    costs: "fund fees in market prices; no trading costs or tax"
    decision_rule: >-
      Descriptive. An interval spanning zero means the evidence doesn't distinguish that pair on that metric. Earlier AUD cash history is indicated
      if the cash-rate and currency effect moves maximum drawdown by 2 percentage points or more in the full window, Q1 2020 or 2022: that is a
      prompt for the owner's own rights decision, and establishes nothing about 2008 itself.
    limitations: "no 2008, the period of most interest; about 15 years, so about five non-overlapping three-year periods, and few stress episodes; one rate regime change dominates; month-end drawdowns; BIL isn't AUD cash and SPY, IEF and BIL have no independent check; EODHD's price source is unresolved; TRI differs from a deposit return"
    not_tested: "hedged returns, costs, tax, AUD assets, any period before 2011"
  variants: []
  inputs: {releases: [], specs: ["equity.us.spy.market_total_return@0.1.0", "rates.us.ief.market_total_return@0.1.0", "cash.us.bil.market_total_return@0.1.0"]}
  runs: ["docs/evidence/e0003/result-1.md"]
  results: {estimates: "values held locally for the owner; agent use and quotation are denied", uncertainty: "paired block bootstrap, held locally", diagnostics: "volatility distinguished for cash rate and currency and for total; all other intervals span zero"}
  negative_findings: "the Treasury duration effect isn't distinguished on any metric in this sample"
  outcome: inconclusive
  follow_up: "earlier AUD cash history indicated by the pre-registered test; the owner's rights decision"
  reviewed_by: null
