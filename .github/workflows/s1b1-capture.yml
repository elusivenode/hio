# S1b-1 scheduled capture, LIVE (T-0009 §2.5; T-0010 W-3; OD-0115, OD-0119; enabled by OD-0143).
#
# Merging this file arms the schedule. The `capture` Environment's required-reviewer rule holds every run,
# scheduled ones included, until it is removed (OD-0119 C-4; go-live package step 8).
# Scheduled-run failure emails go to whoever last changed the `schedule:` lines: repeat the I-5 check after
# any change to them (infra/tofu/README.md).
#
# The storage account URL, the container, and the tenant and client ids of the federated identity are
# read from the `capture` Environment's variables (vars.*), never from secrets and never as literals
# here. The job has `id-token: write` only to obtain a GitHub OIDC token for that federated identity;
# there is no stored secret.
#
# The UTC cron slots equal hio.sources.schedule.CRON_UTC (checked by
# tests/test_s1b1_remediation_schedule.py): each local check in both daylight-saving regimes plus a
# same-day retry. The local-time due gate decides what runs; idempotence makes extra firings no-ops.
name: s1b1-capture
on:
  schedule:
    - cron: "45 22 * * *"
    - cron: "45 23 * * *"
    - cron: "45 0 * * *"
    - cron: "30 5 * * *"
    - cron: "30 6 * * *"
    - cron: "30 7 * * *"
    - cron: "30 12 * * *"
    - cron: "30 13 * * *"
    - cron: "30 14 * * *"
    - cron: "0 19 * * *"
    - cron: "0 20 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: s1b1-capture
  cancel-in-progress: false
jobs:
  capture:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: capture
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: "0.11.19"
          enable-cache: false
      - name: Capture the due slots (live; refuses unless LIVE_AUTHORISATION is set)
        # --rits-calendar is repeated: the committed calendar files are merged (no overlap, no gap).
        run: |
          args=()
          for f in src/hio/reference/calendars/rits-*.yaml; do args+=(--rits-calendar "$f"); done
          uv run --frozen python -m hio.jobs.s1b1_capture "${args[@]}"
        env:
          HIO_STORAGE_ACCOUNT_URL: ${{ vars.HIO_STORAGE_ACCOUNT_URL }}
          HIO_STORAGE_CONTAINER: ${{ vars.HIO_STORAGE_CONTAINER }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
