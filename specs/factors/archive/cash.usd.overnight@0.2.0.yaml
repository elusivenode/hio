# Draft for HIO-S1. External facts are marked [EXT] and are unverified (see registers/sources.yaml).
identity:
  factor_id: cash.usd.overnight
  version: 0.2.0
  status: draft
  owner: quantitative researcher
  family: cash
economics:
  exposure: return on USD overnight secured cash, as the SOFR benchmark compounded in arrears; the USD cash leg and the foreign leg of USD currency positions
  rationale: the financing reference for USD excess returns, and the carry leg of AUD-investor USD exposure
  is_not: a T-bill return, a money-market fund return, an unsecured deposit rate, or a rate locked at the period start
classification:
  series_class: total_return
  investability: replicable_with_basis   # an in-arrears benchmark (RA §3.2 regime "in arrears"): replicable via SOFR-linked deposits or FRNs, or daily rolled repo; the period rate cannot be locked at the start
return_convention:
  return_type: simple
  period: joint calendar J of fx.usd_cash_vs_aud.excess (Sydney business days with an RBA fixing)
  compounding: "RA §3.2: Π_b (1 + SOFR_b × n_b / 360) − 1 within each period; periods chained"
  numeraire: USD
  hedging: n/a
  cash_leg: n/a
  excess_definition: n/a
observations:
  - series_id: nyfed.sofr
    source_id: nyfed_reference_rates
    unit: percent per annum
    knowledge_mode_required: "as_captured_by_hio or as_known_by_market for point-in-time releases; descriptive history may use reconstructed(T), labelled (observations standard §4)"
availability:
  knowable_rule: >-
    Per vintage (observations standard §3). Captured vintages: captured_on_schedule, with
    knowable_at = the documented publication instant for SOFR_b, believed to be the next NY
    business-day morning [EXT, verify in T-0002]. Backfilled history without vintage evidence:
    schedule_only, so reconstructed(T) only. Period knowable_at = max over the SOFR_b used.
  earliest_history: "SOFR from its first publication date in 2018 [EXT]; no pre-SOFR splice in v0.2"
  capture_clock_dependency: point-in-time use starts at the S1 capture start
construction:
  calendar: >-
    Window for period (t−1, t] on J: the calendar days d with t−1 ≤ d < t, read as NY calendar
    dates with the same date labels (declared alignment; see limitations). SOFR business days
    are from the NY Fed calendar [EXT].
  day_count: ACT/360
  algorithm: |
    For each period (t-1, t] on J:
      window W = calendar dates d with t-1 <= d < t
      for each d in W: b(d) = latest SOFR business day <= d      # the rate fixed for d's overnight
      group W by b; n_b = count of days using SOFR_b
      r_t = prod_b (1 + SOFR_b/100 * n_b / 360) - 1               # RA §3.2, exact
      knowable_at(t) = max_b knowable_at(SOFR_b)                  # selection never depends on knowability
    Index: I_t = I_{t-1} * (1 + r_t).
    No SOFR_b with b >= t is ever used (no rate whose overnight starts after the window).
  rebalancing_and_rolls: n/a
  costs: none
invariants:
  standard: [RA-INV-003, RA-INV-018, OBS-INV-001, OBS-INV-002, OBS-INV-003, OBS-INV-007]
  spec_specific:
    - id: CASH-USD-INV-1
      statement: "the index ratio I_t/I_{t-1} - 1 equals r_t exactly"
    - id: CASH-USD-INV-2
      statement: >-
        RA §3.2 fixtures reproduce exactly: Fri→Mon (Fri 4.30% x 3) = 0.000358333333;
        Fri→Tue with a Monday holiday (Fri 4.30% x 4) = 0.000477777778;
        Thu→Mon (Thu 4.30% x 1, Fri 4.40% x 3) = 0.000486154907.
    - id: CASH-USD-INV-3
      statement: "look-ahead trap: for the Fri→Mon period, Monday's SOFR is not used, even when it is already published at evaluation time"
    - id: CASH-USD-INV-4
      statement: "the period knowable_at equals the latest publication instant among the SOFR_b used; for Fri→Mon that is Friday's SOFR publication (on the following NY business day)"
triangulation:
  - reference: US Treasury daily bill rates, 4-week and 13-week [EXT]
    quantity_compared: >-
      A RATE triangulation, not a return comparison. Two comparisons:
      (1) contemporaneous levels: the bill rate converted to an ACT/360 money-market yield,
          y = d / (1 − d·n/360), against the SOFR level on the same date
          (illustrative: d = 4.20%, n = 91 gives y = 4.2450684770%);
      (2) horizon-aligned: the bill yield at t against the realised compounded SOFR over
          [t, t+n), annualised on ACT/360.
      No bill total-return construction is claimed. One may be specified later as its own factor.
    series_class_of_reference: state_indicator
    expected_differences:
      - mechanism: repo versus bill spread (collateral demand, bill supply)
        predicted_sign: either; often SOFR above bills in recent years [EXT, check]
        predicted_magnitude: "a few to tens of bp p.a."
      - mechanism: term premium and expected policy path (comparison 1 only)
        predicted_sign: either
        predicted_magnitude: depends on the policy path
      - mechanism: discount-to-yield conversion and day-count
        predicted_sign: "~0 after conversion"
        predicted_magnitude: "removed by the declared conversion"
    metrics: [mean_level_difference_bp, max_level_difference_bp, horizon_aligned_difference_bp]
limitations:
  - SOFR is a secured overnight repo rate, compounded in arrears; the investable equivalent is approximate
  - "date-label alignment of NY days to the Sydney window is approximate (about a half-day offset at the Sydney 4pm fixing); declared, not corrected"
  - history starts 2018; earlier USD cash needs a separate, declared segment
rights_required:   # per operation (rights standard §3)
  automated_retrieval: allow
  raw_retention: allow
  external_processing: allow
  internal_compute: allow
  derivation: allow
  derived_storage: allow
  distribution: {hio_internal: allow}
changelog:
  - 0.1.0 (2026-10-18): draft
  - "0.2.0 (2026-10-18): numbers change, so a version bump. Rate selection by applicability (RA §3.2), not by knowability; exact in-arrears compounding replaces the false 1e-8 bound; period knowable_at; vintage-specific basis; triangulation restated as a rate comparison (T-0008: F-REVIEW-2026-10-18-a01-2, -6, -7, -1)"
