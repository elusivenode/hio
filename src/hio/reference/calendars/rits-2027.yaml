  - {date: 2027-03-29, reason: "Easter Monday (all states)"}
  - {date: 2027-06-14, reason: "King's Birthday (NSW and Victoria)"}
  - {date: 2027-12-27, reason: "Christmas Day observed (all states; Additional Day, Christmas Day 25 December is a Saturday)"}
  - {date: 2027-12-28, reason: "Boxing Day observed (all states; Additional Day, Boxing Day 26 December is a Sunday)"}
