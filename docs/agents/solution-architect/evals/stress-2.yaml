question: 'An owner asks: We have one operator, limited time, and a multi-year horizon. Should HIO pivot toward
  an AI stock-picking platform because large language models are advancing rapidly, merge its research database
  into MACSMSF to save effort, and prioritise a polished dashboard over factor-return foundations? Reconstruct
  the actual HIO mission and five-year direction from the supplied approved repository evidence. Distinguish
  approved institutional commitments, the SMSF''s intended versus adopted performance objective, provisional
  roadmap, and owner preferences not established as approved policy. Recommend a research capability sequence
  that would produce credible multi-asset portfolio insights while preserving consumer independence. Explicitly
  identify uncertainties and which decisions require the owner.'
